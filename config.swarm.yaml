# SWARM profile: the separate "Prometheus Swarm" app. Applied on top of config.yaml when profile.txt says "swarm".
# Same keys as single mode (F9 dictate, F10 Prometheus, inherited from config.yaml). Push-to-talk, no wake word.
ui:
  ws_port: 8767         # Voice Control uses 8765, dev uses 8766
telemetry:
  project: voicectl-swarm
