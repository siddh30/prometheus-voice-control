# SWARM profile: the separate "Prometheus Swarm" app. Applied on top of config.yaml when profile.txt says "swarm".
# Same keys as single mode (Ctrl+F9 dictate, Ctrl+F10 Prometheus, inherited from config.yaml). Push-to-talk, no wake word.
ui:
  ws_port: 8767         # Voice Control uses 8765, dev uses 8766
hotkeys:
  prometheus: ""         # the swarm replaces Prometheus on Ctrl+F10
  swarm: f10             # press to record, press again to send: the same push-to-talk as single mode
swarm:
  enabled: true
  worker:                 # used by scripts/swarm_worker.sh on a computer that only does work for the swarm
    host: 0.0.0.0         # listen on the home network (every connection must still present SWARM_TOKEN)
    port: 8781
telemetry:
  project: voicectl-swarm
